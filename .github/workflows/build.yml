name: Build Aras Speed Menu

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Android mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: nightly
          target: Android64

      - name: Upload Geode file
        uses: actions/upload-artifact@v4
        with:
          name: ArasSpeedMenu-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
